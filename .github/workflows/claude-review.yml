name: Claude Code Review

on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'review-requested'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }} in this repository.

            Do NOT invoke any sub-skills (e.g. Skill(skill: "review")) — perform the review directly using `gh pr diff ${{ github.event.pull_request.number }}` and `gh pr view ${{ github.event.pull_request.number }}` and the source files via Read/Glob/Grep.

            Review this pull request for:
            - Logic errors and edge cases
            - Type safety, undefined behavior, object lifetimes, and memory ordering
            - Security vulnerabilities
            - Shell script correctness (quoting, race conditions, error handling)
            - Adherence to CLAUDE.md guidelines

            Focus on substantive issues. Skip formatting, naming bikeshedding, and anything handled by linters.
            Post your findings as inline comments on specific lines using mcp__github_inline_comment__create_inline_comment.

            IMPORTANT: You MUST always post a summary comment on the PR when done, regardless of outcome.
            - If issues found: post inline comments AND a summary comment listing the issues.
            - If NO issues found: post a summary comment with "Review completed: approved ✅" and a brief note on what was reviewed.
            Use `gh pr comment ${{ github.event.pull_request.number }} --body "..."` to post the summary. This comment is required — droids and automation depend on it to detect review completion.
          claude_args: '--model claude-sonnet-4-6 --max-turns 50 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*),Read,Glob,Grep"'
